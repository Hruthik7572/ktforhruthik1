name: .NET Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WebApplication1.sln

      - name: Build
        run: dotnet build WebApplication1.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WebApplication1.sln --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish WebApplication1/WebApplication1.csproj --configuration Release --no-build --no-restore --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebApplication1-publish
          path: publish/
          if-no-files-found: error